<title>Ketchup production line</title>

<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#FFF6E8;--bg:#2B2140;--card:#3A2E57;--red:#FF9AA5;--line:#FFF6E8;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#FFF6E8;--bg:#2B2140;--card:#3A2E57;--red:#FF9AA5;--line:#FFF6E8;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{height:100%;margin:0;font:800 clamp(18px,2vw,28px)/1.5 Nunito,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
body.join{overflow:auto}
h1,h2,.hd,button{font-family:'Baloo 2',sans-serif}
#stage{position:fixed;inset:0}
#ui{position:relative;height:100%;display:flex;flex-direction:column;gap:20px;padding:20px;overflow:auto}
body.join #stage{display:none}
.card{background:var(--card);color:var(--ink);border:4px solid var(--line);border-radius:28px;padding:20px 24px}
h1{margin:0;font-size:clamp(28px,5vw,64px);line-height:1.15;font-weight:800;text-align:center;color:var(--red)}
h1 input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:4px dashed var(--red);width:6em;text-align:center}
.row{display:flex;gap:20px;flex:1;align-items:center;flex-wrap:wrap;justify-content:space-between}
.qr{width:clamp(240px,24vw,320px);text-align:center}
.qr small{display:block;font-size:14px;word-break:break-all}
.qr input,.f input,.f textarea{font:inherit;width:100%;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 14px}
#qrbox{display:flex;justify-content:center;margin:10px 0;padding:10px;background:#fff;border-radius:12px}
.chips{max-width:min(420px,100%);display:flex;flex-wrap:wrap;gap:10px;max-height:50vh;overflow:auto}
.chip{background:#FFD6E0;color:#2B2140;border-radius:30px;padding:6px 16px;font-size:20px}
button{cursor:pointer;color:#fff;background:var(--red);border:0;border-radius:40px;min-height:56px;padding:0 36px;font-size:clamp(22px,3vw,36px);font-weight:800;box-shadow:0 6px 0 #7A0C1B}
body.dk button,:root[data-theme="dark"] button{color:#2B2140}
button.alt{background:#FFD98A;color:#2B2140;box-shadow:0 6px 0 #B58A1F}
.center{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap}
#snd{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:10px;z-index:9;min-height:44px;padding:0 16px;font-size:16px;box-shadow:none;background:#2B2140;color:#fff;border:2px solid #fff}
#next,#prev{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:8;width:72px;height:72px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
#next{right:20px}#prev{left:20px;width:52px;height:52px;background:#FFD98A;box-shadow:0 4px 0 #B58A1F}
#back{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:10px;z-index:9;min-height:44px;font-size:16px;padding:0 16px}
#flag{position:fixed;top:max(64px,calc(env(safe-area-inset-top,0px) + 54px));left:10px;z-index:9;min-height:44px;font-size:16px;padding:0 16px}
.cap{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(1000px,calc(100% - 180px));z-index:5}
.tag{display:flex;align-items:center;gap:14px;font-family:'Baloo 2';font-size:clamp(20px,2.4vw,32px);color:var(--red)}
.badge{background:var(--red);color:#fff;border-radius:50%;min-width:2.1em;height:2.1em;display:flex;align-items:center;justify-content:center}
body.dk .badge{color:#2B2140}
.sent{margin:8px 0 0;font-size:clamp(24px,3.4vw,46px);line-height:1.4;font-weight:800}
.err{position:fixed;right:12px;top:64px;width:min(520px,calc(100% - 24px));max-height:calc(100% - 300px);overflow:auto;z-index:7}
.err li{margin:0 0 14px;line-height:1.4}
.err ul{padding-left:20px;margin:8px 0}
.f{max-width:560px;margin:60px auto 20px;display:flex;flex-direction:column;gap:16px}
.f label{display:block;margin-bottom:4px;font-size:20px}
.hint{font-size:18px;min-height:1.4em;color:var(--red)}
.rep{position:fixed;left:0;bottom:0;width:min(46vw,560px);z-index:4;pointer-events:none}
.fl{animation:fl .9s steps(1) infinite;opacity:0}
@keyframes fl{0%,55%,100%{opacity:0}60%{opacity:1}}
.bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.mv{animation:mv 3s linear infinite alternate}
@keyframes mv{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@media(max-width:700px){.cap{width:calc(100% - 24px);bottom:100px}#next{bottom:16px}.err{top:60px;max-height:45%}}
@media(prefers-reduced-motion:reduce){.bob,.mv,.fl{animation:none}}

function nt(t,f,d,ty,v){var o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MB);o.start(t);o.stop(t+d+.05)}
function kick(t){var o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(50,t+.12);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(MB);o.start(t);o.stop(t+.2)}
function hat(t){var b=ac.createBufferSource(),g=ac.createGain(),h=ac.createBiquadFilter();b.buffer=nz;h.type='highpass';h.frequency.value=7000;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);b.connect(h);h.connect(g);g.connect(MB);b.start(t);b.stop(t+.06)}
function sch(){if(!ac)return;if(nextT<ac.currentTime)nextT=ac.currentTime+.05;while(nextT<ac.currentTime+.4){if(sound){var b=Math.floor(stp/8)%4,s=stp%8,t=nextT;nt(t,fq(CH[b][[0,1,2,1,0,1,2,1][s]]),.32,'triangle',.05);if(s%4==0){nt(t,fq(BS[b]),.5,'sine',.18);kick(t)}if(s==2||s==6)nt(t,fq(BS[b]+7),.25,'sine',.08);if(MEL[b][s])nt(t,fq(MEL[b][s]),.3,'triangle',.1);if(s%2)hat(t)}nextT+=.26;stp++}}
function music(){if(mode=='join')return;try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();var m=ac.createGain();m.gain.value=.7;m.connect(ac.destination);var d=ac.createDelay();d.delayTime.value=.39;var fb=ac.createGain();fb.gain.value=.25;d.connect(fb);fb.connect(d);d.connect(m);MB=ac.createGain();MB.connect(m);MB.connect(d);nz=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);var a=nz.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;nextT=ac.currentTime+.1}ac.resume();if(!timer)timer=setInterval(sch,100)}catch(e){}}
function snd(){sound=!sound;$('#snd').textContent=sound?'Sound on':'Sound off';$('#snd').setAttribute('aria-pressed',sound);if(sound)music()}
$('#snd').onclick=snd;document.addEventListener('pointerdown',music,{once:true});
/* data */
var cfgT;function cfgSave(v){cfg.className=v;clearTimeout(cfgT);cfgT=setTimeout(function(){if(db)db.doc('game/config').set({className:v}).catch(function(){})},600)}
function sorted(){return entries.slice().sort(function(a,b){return (a.step-b.step)||(a.ts-b.ts)})}
function title(){return 'IIC '+(mode=='join'?'<span>'+E(cfg.className)+'</span>':'<input id="cn" value="'+E(cfg.className)+'" placeholder="class" aria-label="Class name" oninput="cfgSave(this.value)">')+'’s ketchup production line'}
function chips(){var c=$('#chips');if(c)c.innerHTML=sorted().map(function(e){return '<span class="chip">'+E(e.step)+' · '+E(e.name)+'</span>'}).join('')||'Waiting for students…';var n=$('#cnt');if(n)n.textContent=entries.length+' joined'}
function link(){return location.href.split('#')[0]+'#join'}
function qr(){var b=$('#qrbox');if(!b)return;b.innerHTML='';try{new QRCode(b,{text:$('#lk').value,width:240,height:240})}catch(e){b.textContent='QR unavailable: copy the link'}}
function lobby(){mode='lobby';document.body.className='';$('#stage').innerHTML=hero();$('#ui').innerHTML='<h1 class="card">'+title()+'</h1><div class="row"><div class="card qr"><div class="hd" style="font-size:30px;color:var(--red)">Scan to join</div><div id="qrbox"></div><label class="hd" for="lk" style="font-size:16px">Join link</label><input id="lk" value="'+E(link())+'" oninput="qr()"></div><div class="card chips" id="chips"></div></div><div class="center"><button type="button" onclick="start()">Start the process</button><span class="card hd" id="cnt"></span></div>';qr();chips()}
function join(){document.body.className='join';var h='<div class="card f"><h1>'+title()+'</h1><div><label for="nm">Your name</label><input id="nm" autocomplete="given-name"></div><div><label for="st">Your step (1–15)</label><input id="st" type="number" min="1" max="15" inputmode="numeric" oninput="$(\'#hn\').textContent=LAB[this.value]||\'\'"><div class="hint" id="hn"></div></div><div><label for="tx">Your sentence (passive voice)</label><textarea id="tx" rows="4" placeholder="Before being sent to the factory, tomatoes are sorted…"></textarea></div><button type="button" onclick="send()">Send to the factory</button><div id="ok" class="hint" role="status"></div></div>';$('#ui').innerHTML=h}
function send(){var n=$('#nm').value.trim(),s=parseInt($('#st').value,10),t=$('#tx').value.trim();if(!n||!(s>=1&&s<=15)||!t){$('#ok').textContent='Please fill in your name, a step from 1 to 15, and your sentence.';return}if(!db){$('#ok').textContent='Cannot connect. Ask your teacher.';return}if(!myId){try{myId=localStorage.kid}catch(e){}}myId=myId||Math.random().toString(36).slice(2,10);try{localStorage.kid=myId}catch(e){}db.collection('entries').doc(myId).set({name:n,step:s,text:t,ts:Date.now()}).then(function(){$('#ok').textContent='Sent! Watch the big screen. You can send again to change it.'},function(){$('#ok').textContent='Could not send. Try again.'})}
/* AI check */
async function check(list){var s=await claude.use('sample');if(!s)return false;try{var r=await s.json('You check IELTS Writing Task 1 man-made process sentences. Find REAL spelling or grammar mistakes only, including active voice where passive is clearly needed. Ignore style. Return ONLY a JSON array in the same order: {"i":number,"errors":[{"wrong":"exact words","fix":"corrected words","why":"max 12 plain words"}]}. Use an empty errors array if the sentence is correct.\n'+JSON.stringify(list.map(function(e,i){return {i:i,step:e.step,text:e.text}})));list.forEach(function(e,i){var o=(r||[]).filter(function(x){return x.i===i})[0];checks[e.id]=(o&&o.errors)||[]});return true}catch(e){return false}}
async function start(){if(!entries.length)return;$('#ui').innerHTML='<h1 class="card" style="margin:auto">The reporters are reading the sentences…</h1>';await check(sorted());idx=0;mode='show';document.body.className='';show()}
function S(){return sorted().map(function(e){return {k:'e',e:e}}).concat([{k:'fans'},{k:'money'}])}
function show(){var L=S(),s=L[idx],h='',st='';if(s.k=='e'){var e=s.e,er=checks[e.id]||[];st=scene(e.step);h='<div class="cap card"><div class="tag"><span class="badge">'+E(e.step)+'</span><span>'+E(e.name)+' the Cat · '+E(LAB[e.step]||'')+'</span></div><p class="sent">'+E(e.text)+'</p></div>';if(er.length){st+='';h+=rep()+'<div class="err card"><div class="hd" style="font-size:30px;color:var(--red)">Breaking news: mistakes found!</div><ul>'+er.map(function(x){return '<li><s>'+E(x.wrong)+'</s> → <b>'+E(x.fix)+'</b><br>'+E(x.why)+'</li>'}).join('')+'</ul><textarea id="fx" rows="3" style="width:100%;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px">'+E(e.text)+'</textarea><div class="center" style="margin-top:12px"><button type="button" onclick="fix()">Save fix</button><button type="button" class="alt" onclick="ok()">Accept</button></div></div>'}}else{st=finale(s.k);h='<div class="cap card"><p class="sent">'+(s.k=='fans'?'Customers love '+E(cfg.className||'our')+' ketchup! Everybody wants a bottle.':'The Ketchup Cat is rich! Cat sleeps on a mountain of money.')+'</p></div>'}
$('#stage').innerHTML=st;$('#ui').innerHTML=h+'<button id="back" type="button" class="alt" onclick="lobby()">Lobby</button>'+(s.k=='e'?'<button id="flag" type="button" class="alt" onclick="flag()">Spot a mistake</button>':'')+(idx>0?'<button id="prev" type="button" aria-label="Previous" onclick="go(-1)"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M15 4L7 12L15 20" stroke="#2B2140" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>':'')+(idx<L.length-1?'<button id="next" type="button" aria-label="Next student" onclick="go(1)"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M9 4L17 12L9 20" stroke="currentColor" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>':'')}
function go(d){var n=S().length;idx=Math.max(0,Math.min(n-1,idx+d));show()}
function ok(){var e=S()[idx].e;checks[e.id]=[];show()}
async function fix(){var e=S()[idx].e,t=$('#fx').value.trim();if(!t)return;e.text=t;if(db)try{await db.collection('entries').doc(e.id).update({text:t})}catch(x){}var r=await check([e]);if(!r)checks[e.id]=[];show()}
document.addEventListener('keydown',function(ev){if(mode=='show'&&!/TEXTAREA|INPUT/.test((ev.target||{}).tagName||'')){if(ev.key=='ArrowRight')go(1);if(ev.key=='ArrowLeft')go(-1)}});

var Q=new URLSearchParams(location.search),ROOM=Q.get('room')||'',DBU=(Q.get('db')||'').replace(/\/+$/,''),KEY='';
function dbp(p){return DBU+'/rooms/'+ROOM+'/'+p+'.json'}
function link(){return location.origin+location.pathname+'?room='+ROOM+'&db='+encodeURIComponent(DBU)+'&s=1'}
function cfgSave(v){cfg.className=v;clearTimeout(cfgT);cfgT=setTimeout(function(){fetch(dbp('cfg'),{method:'PUT',body:JSON.stringify({className:v})}).catch(function(){})},600)}
function setup(){document.body.className='join';$('#ui').innerHTML='<div class="card f"><h1>Game setup</h1><div><label for="fu">Firebase Realtime Database URL</label><input id="fu" placeholder="https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app"></div><button type="button" onclick="mk()">Create classroom link</button><div class="hint" id="ok"></div></div>'}
function mk(){var u=$('#fu').value.trim();if(!/^https:\/\/.+(firebaseio\.com|firebasedatabase\.app)/.test(u)){$('#ok').textContent='Paste the full https:// Realtime Database URL.';return}location.search='?room='+Math.random().toString(36).slice(2,6).toUpperCase()+'&db='+encodeURIComponent(u)}
var lobby0=lobby;lobby=function(){if(!ROOM||!DBU){setup();return}lobby0();var k=document.createElement('div');k.className='card';k.innerHTML='<label class="hd" for="ak" style="font-size:16px">Optional AI checking: Anthropic API key (kept only in this tab)</label><input id="ak" type="password" autocomplete="off" style="width:100%;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 14px" oninput="KEY=this.value.trim()">';$('#ui').appendChild(k)};
function send(){var n=$('#nm').value.trim(),s=parseInt($('#st').value,10),t=$('#tx').value.trim();if(!n||!(s>=1&&s<=15)||!t){$('#ok').textContent='Please fill in your name, a step from 1 to 15, and your sentence.';return}try{myId=localStorage.kid}catch(e){}myId=myId||Math.random().toString(36).slice(2,10);try{localStorage.kid=myId}catch(e){}fetch(dbp('entries/'+myId),{method:'PUT',body:JSON.stringify({name:n,step:s,text:t,ts:Date.now()})}).then(function(r){if(!r.ok)throw 0;$('#ok').textContent='Sent! Watch the big screen. You can send again to change it.'}).catch(function(){$('#ok').textContent='Could not send. Try again.'})}
async function pull(){try{var o=(await(await fetch(dbp('entries'))).json())||{};if(mode!='show'){entries=Object.keys(o).map(function(k){var e=o[k];e.id=k;return e});if(mode=='lobby')chips()}var c=await(await fetch(dbp('cfg'))).json();if(c&&c.className!=null&&c.className!==cfg.className){cfg.className=c.className;var i=$('#cn');if(i&&document.activeElement!==i)i.value=c.className;var sp=$('h1 span');if(sp)sp.textContent=c.className}}catch(e){}}
var DIC={tomatos:'tomatoes',tomatoe:'tomato',sended:'sent',putted:'put',cutted:'cut',seperated:'separated',seperate:'separate',quallity:'quality',vinger:'vinegar',suger:'sugar',bottel:'bottle',fatory:'factory',recieved:'received',washt:'washed',boild:'boiled',crushd:'crushed',teh:'the'};
function local(t){var er=[];(t.match(/[A-Za-z']+/g)||[]).forEach(function(x){var f=DIC[x.toLowerCase()];if(f)er.push({wrong:x,fix:f,why:'Spelling or wrong verb form'})});if(!/\b(is|are|was|were|be|been|being)\s+(\w+ly\s+)?\w+(ed|en|wn|nt|ut|ld|id|de|ne|ht|se|ke)\b/i.test(t))er.push({wrong:'(whole sentence)',fix:'is/are + past participle',why:'Use the passive voice'});if(!/^[A-Z]/.test(t))er.push({wrong:t.charAt(0),fix:t.charAt(0).toUpperCase(),why:'Start with a capital letter'});if(!/[.!]$/.test(t))er.push({wrong:'(end)',fix:'.',why:'Finish with a full stop'});return er}
async function check(list){list.forEach(function(e){checks[e.id]=local(e.text)});if(!KEY)return true;try{var p='You check IELTS Writing Task 1 man-made process sentences. Find REAL spelling or grammar mistakes only, including active voice where passive is clearly needed. Ignore style. Return ONLY a JSON array in the same order: {"i":number,"errors":[{"wrong":"exact words","fix":"corrected words","why":"max 12 plain words"}]}. Use an empty errors array if the sentence is correct.\n'+JSON.stringify(list.map(function(e,i){return {i:i,step:e.step,text:e.text}}));var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:2000,messages:[{role:'user',content:p}]})});var j=await r.json(),a=JSON.parse(j.content[0].text.replace(/```json|```/g,'').trim());list.forEach(function(e,i){var o=a.filter(function(x){return x.i===i})[0];if(o&&o.errors)checks[e.id]=o.errors})}catch(e){}return true}
function flag(){var e=S()[idx].e;checks[e.id]=[{wrong:'(flagged by teacher)',fix:'',why:'Look at this sentence together and fix it'}];show()}
async function fix(){var e=S()[idx].e,t=$('#fx').value.trim();if(!t)return;e.text=t;try{await fetch(dbp('entries/'+e.id),{method:'PATCH',body:JSON.stringify({text:t})})}catch(x){}await check([e]);show()}
(!ROOM||!DBU?setup:mode=='join'?join:lobby)();if(mode=='join')$('#snd').style.display='none';
if(ROOM&&DBU){pull();setInterval(pull,2000)}
